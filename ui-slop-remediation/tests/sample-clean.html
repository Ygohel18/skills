<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Craft Telemetry Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d0d0f] text-zinc-100 p-6 font-sans">
  <div class="bg-[#141416] p-6 rounded-xl border border-white/[0.08] shadow-sm">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-medium tracking-tight text-zinc-100">
        Cluster overview
      </h1>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 bg-zinc-800 text-zinc-300 text-xs rounded border border-white/10">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500" aria-hidden="true"></span>
        Operational
      </span>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <button class="bg-zinc-100 text-zinc-900 hover:bg-zinc-200 active:scale-[0.98] px-4 py-2 rounded-md text-sm font-medium transition-[background-color,transform] duration-100">
        Deploy instance
      </button>
      <div class="text-sm text-zinc-400 font-medium">
        Monthly spend: <span class="text-zinc-100 tabular-nums font-mono">$12,450.00</span>
      </div>
    </div>
  </div>
</body>
</html>
