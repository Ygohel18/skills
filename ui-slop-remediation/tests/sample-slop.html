<!DOCTYPE html>
<html lang="en">
<head>

  <title>Vibecoded Dashboard</title>

</head>

      <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">

      </h1>
      <span class="px-3 py-1 bg-purple-600 rounded-full text-xs font-bold animate-pulse">
        PRO ✨
      </span>
    </div>
    <div class="mt-[13px] flex gap-[7px]">
      <button class="bg-gradient-to-r from-pink-500 to-purple-600 px-6 py-3 rounded-full font-bold shadow-lg">
        Supercharge Workflow 🚀!!
      </button>
      <div class="uppercase tracking-widest text-xs text-purple-300">

      </div>
